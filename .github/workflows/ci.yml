name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: australia-southeast1-docker.pkg.dev
  REPO_PATH: field-engineering-apac/kasunt
  IMAGE_NAME: skygate

jobs:
  lint-test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Pinned exact patch: golangci-lint v2.13.1 can't decode the export
          # data golang 1.27.2 emits (format version 5 vs its max of 4).
          go-version: "1.27.1"
      # internal/web/static is committed generated output (like the proto
      # stubs), not gitignored, so go build/test need no UI build step first.
      - run: gofmt -l . | tee /tmp/fmtdiff && [ ! -s /tmp/fmtdiff ]
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: ./...
      - run: go build ./...
      - run: go test ./... -v

  lint-test-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      # internal/web/static is committed output; fail if it's stale relative
      # to web/ source instead of silently shipping a drifted build.
      - run: git diff --exit-code -- ../internal/web/static

  build-push:
    needs: [lint-test-go, lint-test-ui]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for GCP Workload Identity Federation
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet
      - name: Compute tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${REPO_PATH}/${IMAGE_NAME}:${{ steps.tag.outputs.tag }}"
          docker build -f Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

  create-release:
    needs: [build-push]
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create or update release with image location
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${REPO_PATH}/${IMAGE_NAME}:${GITHUB_REF_NAME}"
          # The release may already exist if some other process created it
          # before this job ran; append rather than fail if so, instead of
          # clobbering its notes.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            EXISTING=$(gh release view "${GITHUB_REF_NAME}" --json body -q .body)
            printf '%s\n\n## Docker Image\n\n- `%s`\n' "$EXISTING" "$IMAGE" | gh release edit "${GITHUB_REF_NAME}" --notes-file -
          else
            printf '## Docker Image\n\n- `%s`\n' "$IMAGE" | gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes --notes-file -
          fi
